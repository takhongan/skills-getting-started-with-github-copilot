name: Trigger auto deployment for dify-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/dify-api-AutoDeployTrigger-64ad625f-e5d6-4ddc-97f4-9b4105eab886.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DIFYAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DIFYAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DIFYAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrpocdifyapp.azurecr.io
          registryUsername: ${{ secrets.DIFYAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DIFYAPI_REGISTRY_PASSWORD }}
          containerAppName: dify-api
          resourceGroup: dify-rg
          imageToBuild: acrpocdifyapp.azurecr.io/dify-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


